{% extends "base.html" %}
{% block title %}Error {{ kode }}{% endblock %}
{% block heading %}{{ 'Halaman tidak ditemukan' if kode == 404 else 'Terjadi kesalahan' }}{% endblock %}
{% block content %}
<div class="panel empty-state">
  <i class="bi bi-signpost"></i>
  <h3>{{ kode }}</h3>
  <p class="muted">{{ pesan }}</p>
  <a href="{{ url_for('index') }}" class="btn-accent"><i class="bi bi-house"></i> Kembali ke Dashboard</a>
</div>
{% endblock %}
